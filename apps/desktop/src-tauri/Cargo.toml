[package]
name = "nova-desktop"
description = "App desktop da NovaOffice (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
nova-app.workspace = true
nova-domain-text.workspace = true
nova-spell.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
ureq.workspace = true
semver.workspace = true
sha2.workspace = true

# Exportar para PDF direto (src/pdf.rs): as mesmas versões que o Tauri usa.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
