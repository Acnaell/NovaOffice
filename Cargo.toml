[workspace]
resolver = "2"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
nova-crdt = { path = "crates/nova-crdt" }
nova-domain-text = { path = "crates/nova-domain-text" }
nova-app = { path = "crates/nova-app" }

# `sync`: documentos e desfazer podem ser compartilhados entre threads (exigido pelo estado do Tauri).
yrs = { version = "0.21", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
