name: Relatar um problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Comandos executados, de preferência com um arquivo de exemplo.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      description: Saída de `nova --version`
      placeholder: nova 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional
      options: [Windows, macOS, Linux]
    validations:
      required: true
